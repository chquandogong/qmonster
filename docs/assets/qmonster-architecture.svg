<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Qmonster architecture</title>
  <desc id="desc">Observe-first data flow from tmux pane snapshots through identity, provider parsers, signals, policy, UI, and storage.</desc>
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #111827; stroke: #334155; stroke-width: 2; rx: 8; }
      .accent { fill: #0f766e; }
      .text { fill: #f8fafc; font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #cbd5e1; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #94a3b8; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #14b8a6; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .muted { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="520"/>
  <text class="text" x="56" y="58">Qmonster Observe-First Pipeline</text>
  <text class="sub" x="56" y="88">Provider values stay source-labeled. Policy recommends; operators act.</text>

  <rect class="card" x="56" y="140" width="170" height="92"/>
  <text class="text" x="82" y="178">tmux</text>
  <text class="tiny" x="82" y="207">RawPaneSnapshot</text>

  <rect class="card" x="282" y="140" width="190" height="92"/>
  <text class="text" x="308" y="178">Identity</text>
  <text class="tiny" x="308" y="207">provider / role</text>

  <rect class="card" x="528" y="140" width="190" height="92"/>
  <text class="text" x="554" y="178">Adapters</text>
  <text class="tiny" x="554" y="207">Claude Codex Gemini</text>

  <rect class="card" x="774" y="140" width="190" height="92"/>
  <text class="text" x="800" y="178">Signals</text>
  <text class="tiny" x="800" y="207">MetricValue + source</text>

  <rect class="card" x="382" y="320" width="190" height="92"/>
  <text class="text" x="408" y="358">Policy</text>
  <text class="tiny" x="408" y="387">pure recommendations</text>

  <rect class="card" x="642" y="320" width="170" height="92"/>
  <text class="text" x="668" y="358">UI</text>
  <text class="tiny" x="668" y="387">alerts / panes</text>

  <rect class="card" x="872" y="320" width="170" height="92"/>
  <text class="text" x="898" y="358">Store</text>
  <text class="tiny" x="898" y="387">audit / snapshots</text>

  <path class="arrow" d="M226 186 H282"/>
  <path class="arrow" d="M472 186 H528"/>
  <path class="arrow" d="M718 186 H774"/>
  <path class="arrow" d="M869 232 C850 292 686 308 572 344"/>
  <path class="arrow" d="M572 366 H642"/>
  <path class="muted" d="M572 388 C684 464 810 452 872 388"/>

  <rect class="accent" x="56" y="456" width="1008" height="2"/>
  <text class="tiny" x="56" y="486">Invariant: adapters never infer identity; policy performs no IO; default action mode is recommend_only.</text>
</svg>
