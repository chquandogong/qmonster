<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Qmonster banner</title>
  <desc id="desc">Qmonster observe-first terminal UI banner for Claude, Codex, and Gemini tmux panes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#10202a"/>
      <stop offset="1" stop-color="#1f1a12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dd6c6"/>
      <stop offset="0.55" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M70 276 C220 206 336 316 492 236 C648 156 790 268 926 174 C1014 113 1082 109 1130 118" fill="none" stroke="url(#line)" stroke-width="4" opacity="0.85"/>
  <g filter="url(#shadow)">
    <rect x="72" y="64" width="520" height="228" rx="16" fill="#09111c" stroke="#263647"/>
    <rect x="72" y="64" width="520" height="42" rx="16" fill="#131d2b"/>
    <circle cx="101" cy="85" r="6" fill="#ff6b5f"/>
    <circle cx="123" cy="85" r="6" fill="#f2c14e"/>
    <circle cx="145" cy="85" r="6" fill="#3ddc97"/>
    <text x="104" y="142" fill="#8be9fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">Claude main</text>
    <text x="104" y="178" fill="#f8f8f2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">CTX 73% | CACHE 81% | COST $384.61</text>
    <text x="104" y="214" fill="#f2c14e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">RESET 5H 28m | TOKENS 1.53M</text>
    <text x="104" y="250" fill="#bdc7d5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">recommend: snapshot before reset</text>
  </g>
  <g>
    <text x="650" y="136" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800">Qmonster</text>
    <text x="654" y="180" fill="#d7dee9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="600">Observe-first TUI for multi-CLI tmux work</text>
    <text x="654" y="224" fill="#9fb1c5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">Claude Code + Codex + Gemini panes</text>
    <text x="654" y="258" fill="#9fb1c5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22">alerts, token pressure, reset ETA, recommendations</text>
  </g>
</svg>
