# Qmonster pricing table (Estimated, operator-curated)
#
# Standard operator path: ~/.qmonster/config/pricing.toml.
# `scripts/run-qmonster.sh` copies this template there when missing.
#
# Values are USD per 1 million tokens. Leave placeholders at 0.00 to skip cost
# estimation for a given (provider, model) pair -- Qmonster will render no
# "COST [Estimate]" badge for that combination.
#
# This table is ProjectCanonical. Qmonster does NOT fetch provider pricing
# pages. Refresh manually when prices change; the file is gitignored so each
# operator owns their own numbers. Cost estimates are for trend tracking,
# NOT for billing reconciliation.
#
# Last updated by operator: YYYY-MM-DD

[[entries]]
provider = "codex"
model = "gpt-5.4"
input_per_1m = 0.00    # TODO(operator): fill in from OpenAI pricing
output_per_1m = 0.00

[[entries]]
provider = "claude"
model = "claude-sonnet-4-6"
input_per_1m = 0.00    # TODO(operator): fill in from Anthropic pricing
output_per_1m = 0.00

# Add the model rows your panes actually surface in the m overlay /
# pane card. `model` matches the string the provider's status line
# emits, so `claude-opus-4-7`, `gpt-5.4-mini`, and `gemini-3.1-pro` are
# all valid keys. Until the rate is non-zero, lookup() returns None and
# Qmonster renders no COST badge / cost_slope rule stays silent for
# that pane — exactly the v1.49.0 baseline behaviour.
[[entries]]
provider = "claude"
model = "claude-opus-4-7"
input_per_1m = 0.00    # TODO(operator): fill in from Anthropic pricing
output_per_1m = 0.00

[[entries]]
provider = "gemini"
model = "gemini-3.1-pro"
input_per_1m = 1.25
output_per_1m = 5.00

[[entries]]
provider = "gemini"
model = "gemini-3.1-flash"
input_per_1m = 0.075
output_per_1m = 0.30
