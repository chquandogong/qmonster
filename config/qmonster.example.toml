# qmonster.example.toml
# Version: v1.16.54
# Date: 2026-04-27
# Runtime-consumed example config for the current binary. The standard
# operator path is `~/.qmonster/config/qmonster.toml`; `scripts/run-qmonster.sh`
# creates it from this template when missing, and the in-TUI settings overlay
# writes threshold edits back there unless `--config PATH` points elsewhere.
# Phase 6 Team Mode: if a sibling `qmonster.local.toml` exists next to the
# loaded `qmonster.toml`, Qmonster recursively merges it after this file.
# Keep shared/team defaults here; put machine-local overrides in the local file.
#
# Parsed today by `src/app/config.rs`:
# - [tmux]    source, poll_interval_ms, capture_lines
# - [logging] sensitivity, retention_days, big_output_chars
# - [token]   quota_tight
# - [actions] mode, allow_auto_*
# - [refresh] policy
# - [storage] root
# - [insights] ignored_ttl_secs, default_window_secs
# - [idle]    stillness_polls
# - [security] posture_advisories
# - [cost]    budget_usd, warning_usd, critical_usd, [.claude|.codex|.gemini]
# - [context] warning_pct, critical_pct, [.claude|.codex|.gemini]
# - [quota]   warning_pct, critical_pct, [.claude_5h|.claude_weekly|.codex_5h|.codex_weekly|.gemini]
# - [cache]   hot_ratio_threshold, cold_ratio_threshold, hot_low_ctx_threshold,
#             cold_high_ctx_threshold, drift_drop_threshold, drift_min_samples
# - [ux]      confirm_actions
# - [reset]   wait_pressure_threshold, wait_eta_secs, snapshot_pressure_threshold,
#             snapshot_eta_secs, auto_snapshot
#
# Everything else belongs in docs/ai/* or tmux launcher conventions,
# not in runtime TOML.

[mux]
# Terminal multiplexer backend (v3.2.0).
#   auto   — use herdr when Qmonster runs inside a herdr pane (HERDR_ENV /
#            HERDR_SOCKET_PATH present), otherwise the [tmux] behavior below.
#   tmux   — force tmux ([tmux] source applies).
#   herdr  — force the herdr CLI backend (global view across workspaces).
backend = "auto"                   # auto | tmux | herdr
# herdr only: also observe plain shell panes (default: agents + self only).
include_shell_panes = false

[tmux]
# auto (default) tries control_mode first and falls back to polling if tmux
# control-mode cannot attach at startup. Set polling or control_mode to force
# one transport; explicit control_mode attach failures stay visible.
# poll_interval_ms / capture_lines apply to the herdr backend as well.
source = "auto"                    # auto | polling | control_mode
poll_interval_ms = 2000
capture_lines = 24

[logging]
sensitivity = "balanced"         # minimal | balanced | forensic
retention_days = 14
big_output_chars = 2200

[token]
quota_tight = false
# Reference only: context/log/repeat thresholds are still code defaults.
# `logging.big_output_chars` above is the only threshold wired from TOML.

[idle]
# Consecutive identical tail snapshots before stillness fallback marks a
# pane idle/stale. Runtime clamps out-of-range values to [2, 12].
stillness_polls = 4

[security]
# Default false: permissive runtime posture remains visible as badges only.
# Set true to also emit Concern advisories when provider runtime facts expose
# YOLO / bypass permissions / Full Access / danger-full-access / no sandbox.
posture_advisories = false

# v1.15.16 — per-provider USD thresholds for the cost_pressure_warning /
# cost_pressure_critical advisory rules (see src/policy/rules/advisories.rs).
# Cost budget tracking also records positive USD deltas in SQLite and emits
# one-shot alerts at 80% and 100% of `budget_usd`.
# `cost_usd` is currently populated only on Codex panes (Claude/Gemini
# leave it None today); when a future provider populates cost_usd, the
# advisory rules consume the same thresholds from this table.
#
# `warning_usd` / `critical_usd` apply to any provider that does not have
# a `[cost.<provider>]` override below. Per-provider tables (when present)
# replace BOTH thresholds for that provider only.
#
# Recommended defaults (track empirical 2026-04-27 pricing-tier
# expectations; tune freely):
#   - default → \$5 / \$20  (Codex `gpt-5.4` baseline; matches the
#     v1.15.14 hardcoded constants this section replaces)
#   - claude  → \$10 / \$30 (Claude Sonnet/Opus pricing is meaningfully
#     higher per 1M tokens; bands shift up so the same operator workload
#     does not raise advisories on every session)
#   - codex   → unset       (Codex uses the top-level defaults)
#   - gemini  → \$3 / \$10  (Gemini Pro pricing tends lower; raise the
#     advisory earlier in absolute USD terms)
#
# Behaviour invariants:
#   - cost_pressure_warning fires when warning_usd <= cost_usd < critical_usd.
#   - cost_pressure_critical fires when cost_usd >= critical_usd.
#   - Both rules respect the IdentityConfidence gate (KD-007); both
#     leave `suggested_command: None` (no slash command resolves an
#     accumulated session cost — operator picks pace / model-switch /
#     end-session). Source label is `Estimated` because the threshold
#     is a Qmonster pick, not a provider-documented limit.
[cost]
budget_usd = 200.0
warning_usd = 5.0
critical_usd = 20.0

[cost.claude]
warning_usd = 10.0
critical_usd = 30.0

# [cost.codex]                    # uncomment to pin Codex thresholds
# warning_usd = 5.0
# critical_usd = 20.0

[cost.gemini]
warning_usd = 3.0
critical_usd = 10.0

# v1.15.17 — per-provider context_pressure thresholds for the
# context_pressure_warning / context_pressure_critical advisory rules
# (see src/policy/rules/advisories.rs). `context_pressure` is populated
# by Claude `/context`, Codex bottom status, and Gemini status table, so
# all three providers honour these thresholds when that provider surface
# is visible or has just been captured through `u` runtime refresh.
#
# `warning_pct` / `critical_pct` are fractions in 0..=1.0 (not %). They
# apply to any provider that does not have a `[context.<provider>]`
# override below. Per-provider tables (when present) replace BOTH
# thresholds for that provider only.
#
# Recommended defaults: 0.75 / 0.85 for every provider — the workflow
# advice ("/compact + checkpoint") is uniform across CLIs and the
# absolute pressure value already accounts for context-window size
# differences. Override only if a specific provider's pressure metric
# is consistently noisy at one end of the band.
#
# Behaviour invariants:
#   - context_pressure_warning  fires when warning_pct <= context_pressure < critical_pct.
#   - context_pressure_critical fires when context_pressure >= critical_pct.
#   - Both rules respect the IdentityConfidence gate (KD-007); both
#     suggest `/compact` and emit a strong (CHECKPOINT-slot) rec so the
#     advisory rises above non-strong signals.
[context]
warning_pct = 0.75
critical_pct = 0.85

# [context.claude]                  # uncomment to pin Claude thresholds
# warning_pct = 0.75
# critical_pct = 0.85

# [context.codex]                   # uncomment to pin Codex thresholds
# warning_pct = 0.75
# critical_pct = 0.85

# [context.gemini]                  # uncomment to pin Gemini thresholds
# warning_pct = 0.75
# critical_pct = 0.85

# v1.16.51 — quota_pressure thresholds. Gemini exposes one quota column;
# Claude and Codex expose two quota windows. For Codex, bottom status
# `5h N%` is the rolling 5-hour limit and `weekly N%` is the weekly
# limit. For Claude, `/usage` "Current session" is the rolling 5-hour
# limit and "Current week (all models)" is the weekly limit.
#
# Behaviour invariants:
#   - quota_pressure_warning  fires when warning_pct <= quota < critical_pct.
#   - quota_pressure_critical fires when quota >= critical_pct.
#   - Both rules respect the IdentityConfidence gate (KD-007). Neither
#     emits a `suggested_command`: rate-limited quotas reset on the
#     provider's schedule, not via a slash command — the operator picks
#     between pacing, switching account/model, or pausing the pane.
[quota]
warning_pct = 0.75
critical_pct = 0.85

# [quota.claude_5h]                 # Claude /usage Current session
# warning_pct = 0.75
# critical_pct = 0.85

# [quota.claude_weekly]             # Claude /usage Current week (all models)
# warning_pct = 0.75
# critical_pct = 0.85

# [quota.codex_5h]                  # Codex bottom status `5h N%`
# warning_pct = 0.75
# critical_pct = 0.85

# [quota.codex_weekly]              # Codex bottom status `weekly N%`
# warning_pct = 0.75
# critical_pct = 0.85

# [quota.gemini]                    # uncomment to pin Gemini thresholds
# warning_pct = 0.75
# critical_pct = 0.85

# Phase F F-7-config (v1.28.0): operator-tunable cache-rule thresholds.
# Defaults match the v1.27.0 hardcoded values exactly. Adjust to taste:
# - Lower hot_ratio_threshold to fire the "don't /compact yet" warning more aggressively
# - Lower cold_ratio_threshold to require a lower cache hit before suggesting /compact
# - drift_min_samples controls how much history must accrue before drift fires
[cache]
hot_ratio_threshold = 0.6      # cache_hit_ratio > this → "cache hot, avoid /compact"
cold_ratio_threshold = 0.3     # cache_hit_ratio < this → "cache cold, /compact OK"
hot_low_ctx_threshold = 0.7    # hot warning requires context_pressure < this
cold_high_ctx_threshold = 0.6  # cold compact-recommendation requires context_pressure > this
drift_drop_threshold = 0.30    # ratio drop ≥ this (in absolute) triggers cache_drift rule
drift_min_samples = 4          # cache_drift requires this many samples in the window

[actions]
mode = "recommend_only"          # observe_only | recommend_only | safe_auto
allow_auto_notifications = true
allow_auto_archive = true
allow_auto_prompt_send = false
allow_destructive_actions = false

[refresh]
policy = "manual_only"

[storage]
# Optional absolute path override. Leave unset to use the default
# `~/.qmonster/` root. `~` is not expanded inside TOML values here.
# root = "/abs/path/to/qmonster-root"

# Runtime-derived paths under `storage.root`:
# - qmonster.db
# - archive/
# - snapshots/
# - versions.json
#
# Pane title convention used by the resolver and tmux launcher:
#   {provider}:{instance}:{role}
# Recommended default layout:
#   claude:1:main
#   codex:1:review
#   gemini:1:research
#   qmonster:1:monitor

# Phase 8 v2 Token Insights lifecycle-ledger defaults. `ignored_ttl_secs`
# controls the conservative "TTL ignored" classifier once
# recommendation_events / recommendation_outcomes exist. It is a Qmonster
# classification, not an operator-confirmed rejection.
[insights]
ignored_ttl_secs = 1800
default_window_secs = 86400

# v1.38 UX bundle (spec §6.2): cadence for the action-explainer modal
# that previews what `p` (prompt-send), `d` (dismiss/archive), and `y`
# (yes/confirm) will do before executing them.
#   - always     → confirm every time (default; safest for new operators)
#   - first_time → show the modal once per action kind in a session,
#                  then assume the operator has read it
#   - never      → skip the modal entirely (operator already knows what
#                  each shortcut does)
[ux]
# How often to show the action-explainer modal before executing p / d / y.
# always | first_time | never
confirm_actions = "always"

# Phase F F-7d (v1.35.0): operator-tunable thresholds for the reset-aware
# advisories. Defaults match the v1.34.0 (F-7c) hardcoded values exactly;
# operators who never edit this section see no behavior change.
[reset]
wait_pressure_threshold = 0.85   # quota pressure floor for "pause until reset" advisory
wait_eta_secs = 1800              # reset ETA ceiling (secs) for the same advisory (30 min)
snapshot_pressure_threshold = 0.50  # quota pressure floor for "snapshot before reset" advisory
snapshot_eta_secs = 300           # reset ETA ceiling (secs) for the same advisory (5 min)

# Phase H opt-in auto-snapshot at reset boundary (v1.42.0).
# When true, Qmonster writes one snapshot per (pane, quota window)
# whenever the F-7c recommend_snapshot_before_reset advisory fires.
# The snapshot lands under ~/.qmonster/snapshots/<timestamp>.json
# and records a SnapshotWritten audit event. Default false — existing
# v1.41.0 operators see no behavior change.
# auto_snapshot = false

# Phase 7 v1 anomaly observation surface (v1.43.0).
# Master switch + four conservative-default detectors. When enabled,
# the m overlay grows an "ANOMALIES" row per pane card. v1 emits no
# Recommendation, no Notify, no audit event — observation only.
# Operators wanting Recommendation promotion / Notify wait for v2.
#
# v2.2.0 provenance note (P0-3): every threshold below is currently
# intuition-driven (operator-experience guesses, not measurement). The
# P1-3 recommendation-acknowledgement telemetry is the planned vehicle
# for replacing these with measured values. See src/policy/gates.rs
# `Default impl` for the inline provenance tags on each gate.
# [anomaly]
# enabled                          = false
# window_polls                     = 20
# min_confidence                   = "medium"
# identity_churn_min_flips         = 3
# error_burst_threshold            = 0.5
# cache_discontinuity_drop         = 0.30
# cross_pane_cluster_min_findings  = 3
# Phase 7 v2 detectors (v1.45.0). Conservative defaults — fire on
# meaningful slopes, not noise.
# cost_slope_usd_per_hour          = 20.0
# token_slope_input_per_poll       = 20000
# memory_growth_mb                 = 1024

# Phase 7 v3 (c) (v1.47.0): retention horizon for anomaly_events table.
# Older rows are deleted on Qmonster startup. Default 30 days; a 100K-row
# hard cap also applies. Snapshots auto-purge at 4× window_polls.
# retention_days = 30

# Phase 7 v3 (v1.46.0): per-kind promotion thresholds.
# Distinct from [anomaly] min_confidence (visibility filter):
# this gates promotion to Recommendation only.
# Allowed values: "low", "medium", "high".
# [anomaly.promote]
# identity_churn         = "high"
# error_burst            = "high"
# cache_discontinuity    = "high"
# cross_pane_edit_cluster = "high"
# cost_slope             = "high"
# token_slope            = "high"
# memory_growth          = "high"
# subagent_side_effect   = "medium"
