  scope: "Bundled release gate for v2.5.0 (Slice A Claude sidefile-preferred + Slice B Codex rollout backstop + Slice C1 docs). Gemini r1 leg retired this release (individual-tier sunset) — contract is now Codex + human (WORKFLOWS §6 amended)."
