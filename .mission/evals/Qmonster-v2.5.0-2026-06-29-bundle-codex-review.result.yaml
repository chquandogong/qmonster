      status: closed
      closed_by: "bb69eaf"
      resolution: "Added AMBIGUITY_WINDOW=60s; read_rollout_for_path collects the top-2 cwd-matching codex-tui rollouts and returns None when their mtimes fall within the window; regression test `ambiguous_concurrent_same_cwd_codex_tui_returns_none` added. The fill-when-absent + scrape fallback means the conservative None is safe."
  observations:
    - id: OBS-250-1
      severity: good
      description: "Claude pressure override semantics correct (clamped [0,1], override only when used_percentage present); Claude model/effort + Codex fields fill-only; boundary purity intact (rollout JSONL knowledge confined to codex_rollout.rs)."
    - id: OBS-250-2
      severity: good
      description: "Deferring reasoning_output_tokens / model_context_window (no SignalSet expansion) is correct for an acquisition-channel-hardening release."
  scope_reduction_suggestions:
