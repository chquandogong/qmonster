  verdict: approve-with-fixes
  confidence: 82
  baseline_green: "1642 lib + 140 integration/supporting, 0 failed (cargo test --all-targets on narrow-vnext = v2.8.0 code)."
  summary:
    direction: "B+ direction is correct (collapse overlays, keep provider-neutral core), but two premises were overstated in the draft and would damage core signals / forensic UX if cut literally."
    overstated_premises:
      - "'structured-output primary, scrape fallback' — true ONLY for Claude (sidefile). Codex rollout backfills token/model/window only; Gemini has no structured channel."
      - "'overlay 흡수는 무손실' — metrics (trend/slope-ETA) and anomaly overlay (Ring/History, promoted/high filter, evidence) carry state Alerts/pane-card don't."
  must_fix:
    - id: SFX-1
      severity: critical
      title: "Adapter plan: Codex/Gemini tail parsing is the CORE signal path, not a fallback."
      detail: "context_pressure/quota_5h/quota_weekly/idle for Codex come from codex.rs:74,85 (tail), not rollout (codex_rollout.rs:19 = token/model/window only). Gemini context/quota/model/memory all from status-table tail (gemini.rs:188,247); /stats /model also tail-merged. REDUCE-to-fallback only applies to Claude (sidefile)."
      resolution: "MDR §8.2 — Codex/Gemini core-signal tail parsers reclassified KEEP; only enrichment-chasing (codex_app_server, agy x3, gemini /stats /model interactive) is CUT."
    - id: SFX-2
      severity: important
      title: "Define minimal replacement surfaces BEFORE removing metrics/anomaly overlays."
      detail: "metrics overlay holds pressure/mem trend + slope ETA (metrics.rs:103,146); anomaly overlay holds Ring/History + promoted/high filter + evidence (anomaly_overlay.rs:16,34). Folding anomaly into Alerts risks showing only promoted anomalies, weakening the forensic trail."
      resolution: "MDR §8.2/§8.4 slice 4 — port metrics trend/ETA to pane PRESSURE/--once; add a 'recent anomaly strip'/digest history in Alerts; detection stays, only the overlay surface moves."
    - id: SFX-3
      severity: important
      title: "profiles.rs removal is a domain/UI/schema migration, not a single-file cut."
      detail: "Recommendation.profile (recommendation.rs:73) + domain/profile.rs + ui::panels::format_profile_lines (panels/mod.rs:42) + settings profile config all know the ProviderProfile payload."
      resolution: "MDR §8.2/§8.4 slice 2 — remove eval_profiles call, then the profile field + domain type + renderer + settings together, each step --all-targets green."
  other_findings:
    over_cut:
      - "codex_app_server cut is OK (Codex-only) but SignalSet:178 designed Codex reset-ETA via app-server — must explicitly state 'Codex reset ETA abandoned in vNext'."
