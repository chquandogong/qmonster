    - "2. Profiles slice (engine.rs:52 → Recommendation.profile → domain/profile.rs → format_profile_lines → settings)."
    - "3. UI shell slice (keymap/footer/help → render entrypoint → overlay state → delete files)."
    - "4. Metrics/anomaly absorption (port trend/ETA/history/evidence minimal surfaces first)."
    - "5. Adapter narrow (per-provider: Codex tail KEEP + rollout backstop; Gemini status KEEP + /stats optional cut; Claude sidefile primary + tail fallback)."
    - "6. Settings/provider-setup (Thresholds/Integrations + availability diagnostics)."
    - "7. Final prune (FX wiring-first, insights overlay/store, pending batch, hover bilingual)."
