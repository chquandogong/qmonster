review:
  project: Qmonster
  reviewer: codex
  date: "2026-07-01"
  target_versions:
    - "3.1.4"
  commit_range: "d1b586e (v3.1.3 published ledger) → working tree: the v3.1.4 batch (audit_events retention fix + app-wide panic hook + decorative FX overlay restore). Pre-push gate for v3.1.4."
  scope: >
    Pre-push code-diff review of the v3.1.4 batch, three parts. (B) retention:
    src/store/retention.rs + src/app/startup.rs now prune audit_events (ts_utc
    RFC3339 lexicographic cutoff), anomaly_events / anomaly_history_snapshots
    (unix secs), cost_usage_events (unix ms) to retention_days via a new
    table_exists-guarded prune_older_than helper, and DROP legacy
    recommendation_events / recommendation_outcomes — fixing unbounded
    audit_events growth (4.7M rows / 1.1 GB in the field). (#3) panic hook: new
    src/app/panic_hook.rs + install() in src/main.rs (restore terminal + append
    crash.log + chain default hook). (C) FX restore: FxConfig in config.rs +
    tui_loop/dashboard_render wiring (Q hotkey, idle screensaver, prompt-send
    celebration, key/mouse dismiss, 30 FPS fast-frame poll) + footer/hover_help
    `Q fx`. fx_state.rs / fx_overlay.rs / fx.rs are VERBATIM v2.8.0 restores
    (only FX_TARGET_FPS 60→30) and were excluded from the diff sent to Codex.
  evidence_mode: "Live `codex exec --dangerously-bypass-approvals-and-sandbox -c model_reasoning_effort=medium` (codex-cli 0.142.5; env externally sandboxed → nested bwrap couldn't init loopback, so the ~1000-line unified diff was INLINED in the prompt, no repo reads; panic_hook.rs included via `git add -N`, the 3 verbatim FX modules excluded)."
  verdict: approve-with-fixes
  confidence: n/a
  local_validation:
    cargo_fmt_check: pass
    cargo_clippy_all_targets_d_warnings: pass
    cargo_test_all_targets: pass
    test_counts: "1311 lib + 62 integration + supporting; --all-targets green (lib 1259 → 1311: +42 restored FX + 1 degenerate-viewport regression + 1 Q-hotkey gate + 3 retention + 3 panic-hook + 2 retention P2)"
  guard_points_verified:
    - "fx_overlay mutable-in-screensaver-block then shared-into-render-view borrows are scoped correctly (Codex confirmed no borrow-checker/lifetime issue)"
    - "no definite celebration double-fire from the diff — the action-explainer Enter path and the direct p-accept path are mutually exclusive via should_open_explainer (Codex confirmed)"
    - "cutoff_ms/1000 is the right unit for the unix-seconds anomaly tables; under-deletes by <1s at the boundary only (Codex confirmed)"
    - "lexicographic ts_utc deletion is correct UNDER the contract that ts_utc is always Utc::now().to_rfc3339() with the same UTC offset — true for every current write path (SqliteAuditSink::record); noted as a contract, not a bug"
  findings:
    - id: CFX-314-1
      severity: P2
      area: src/store/retention.rs
      title: "prune_older_than checked table existence but not column existence"
      detail: "On a legacy DB where a target table exists with a different timestamp column name/type, `DELETE FROM {table} WHERE {ts_col} < ?1` would return `no such column` and abort the whole sweep (including audit pruning)."
      resolution: "Added column_exists() (PRAGMA table_info) guard; prune_older_than returns 0 when the table OR its ts column is absent. Regression test sweep_tolerates_a_table_missing_its_timestamp_column."
      status: closed
    - id: CFX-314-2
      severity: P2
      area: src/app/panic_hook.rs
      title: "panic-capable work ran before chaining to the default hook (double-panic risk)"
      detail: "Terminal restore, formatting, forced backtrace capture, chrono formatting, and the filesystem write all ran before default_hook(info). A panic inside the hook would abort the process before the default hook ran, swallowing the crash report."
      resolution: "Wrapped the best-effort restore+log block in std::panic::catch_unwind(AssertUnwindSafe(..)); default_hook(info) now always runs afterwards."
      status: closed
    - id: CFX-314-3
      severity: P2
      area: src/store/retention.rs
      title: "unchecked retention-day arithmetic could overflow"
      detail: "`max_age_days * 86_400`, `(max_age_days as i64) * 86_400_000`, and ChronoDuration::days(max_age_days as i64) can overflow / wrap / produce a future cutoff on an absurd config value."
      resolution: "Clamp max_age_days to 36_500 (100 years) after the zero-check, before any arithmetic. Regression test sweep_does_not_overflow_on_absurd_retention_days (u64::MAX)."
      status: closed
  human_signoff: pending
