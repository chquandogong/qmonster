      file: "src/ui/dashboard.rs"
      title: "Now-strip quota_or_cost_now_summary has no observe-only filter — agy quota would be promoted into the attention strip once enrichment populates it."
      proposed_change: "Filter observe-only providers from BOTH the quota selection and the cost selection in quota_or_cost_now_summary. agy quota stays visible in its pane tile (display) but is never promoted as an alert. agy idle/wait state still shows (state, not advisory)."
