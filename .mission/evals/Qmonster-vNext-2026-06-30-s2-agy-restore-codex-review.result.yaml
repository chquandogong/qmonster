    - id: CFX-S2-2
      severity: important
      file: "src/app/event_loop.rs"
      title: "Auto-snapshot block (reset-boundary) lacked an explicit !observe_only guard — indirectly safe only because agy recs are empty."
      proposed_change: "Add `&& !observe_only` to the auto-snapshot gate (defense-in-depth, mirrors the cost/identity/anomaly appends)."
      status: closed
      closed_by: "S2 — guard added."
    - id: CFX-S2-3
      severity: important
      title: "Need enriched-agy regression: ctx + 5h/weekly quota + resets populated => zero recs, zero effects (no Notify, no PromptSendProposed)."
      proposed_change: "Strengthen policy::engine::tests::agy_enriched_pane_recommendations_are_empty with weekly quota + both resets + effects assertions."
      status: closed
      closed_by: "S2 — engine test strengthened; 6-gate agy_observeonly_regression stays green."
