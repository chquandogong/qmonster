name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust, docs, and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::uninlined_format_args

      - name: Audit cargo dependencies for known advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run npm package
        run: npm pack --dry-run

      - name: Verify npm package files allow-list covers top-level docs
        run: |
          set -euo pipefail
          pack_files="$(npm pack --json --dry-run 2>/dev/null \
            | node -e "const d=require('fs').readFileSync(0,'utf8'); const j=JSON.parse(d); console.log(j[0].files.map(f=>f.path).join('\n'))")"
          missing=""
          while IFS= read -r repo_doc; do
            if ! printf '%s\n' "$pack_files" | grep -Fxq "$repo_doc"; then
              missing="$missing $repo_doc"
            fi
          done < <(find docs -maxdepth 1 -type f -name '*.md' | sort)
          if [ -n "$missing" ]; then
            echo "ERROR: top-level docs/*.md files exist in repo but are missing from npm package:" >&2
            for f in $missing; do echo "  - $f" >&2; done
            echo "Add them to package.json files allow-list or remove them from the repo." >&2
            exit 1
          fi
          echo "OK: all top-level docs/*.md files are included in npm package."
