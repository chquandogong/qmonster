name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: "0.22.1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rust, docs, and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Catch new vulnerable / disallowed-license deps at PR diff time
      # — runs only on pull_request events, before any cargo work. Push
      # / workflow_dispatch events skip this step. fail-on-severity is
      # set to moderate so MDR-accepted low advisories (e.g. the
      # accepted lru RUSTSEC-2026-0002) do not block routine PRs.
      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::uninlined_format_args

      - name: Install cargo-audit
        run: |
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"

      - name: Audit cargo dependencies for known advisories
        run: cargo audit

      - name: Verify npm package has no lifecycle scripts or runtime deps
        # Supply-chain guard: the npm wrapper must remain a thin
        # cargo-run shim. Lifecycle scripts (preinstall, install,
        # postinstall, prepare, prepublishOnly, prepack) or a non-empty
        # dependencies/devDependencies list would expand the published
        # tarball's trust surface — fail CI before they reach the
        # registry.
        run: |
          set -euo pipefail
          node -e '
            const pkg = require("./package.json");
            const forbidden = ["preinstall","install","postinstall","prepare","prepublishOnly","prepack"];
            const scripts = pkg.scripts || {};
            const badScripts = forbidden.filter(n => Object.prototype.hasOwnProperty.call(scripts, n));
            const deps = Object.keys(pkg.dependencies || {});
            const devDeps = Object.keys(pkg.devDependencies || {});
            const failures = [];
            if (badScripts.length) failures.push("forbidden lifecycle scripts: " + badScripts.join(", "));
            if (deps.length) failures.push("non-empty dependencies: " + deps.join(", "));
            if (devDeps.length) failures.push("non-empty devDependencies: " + devDeps.join(", "));
            if (failures.length) {
              console.error("ERROR: npm package surface check failed:");
              for (const f of failures) console.error("  - " + f);
              process.exit(1);
            }
            console.log("OK: package.json has no lifecycle scripts and no runtime dependencies.");
          '

      - name: Dry-run npm package
        run: npm pack --dry-run

      - name: Verify npm package files allow-list covers top-level docs
        run: |
          set -euo pipefail
          pack_files="$(npm pack --json --dry-run 2>/dev/null \
            | node -e "const d=require('fs').readFileSync(0,'utf8'); const j=JSON.parse(d); console.log(j[0].files.map(f=>f.path).join('\n'))")"
          missing=""
          while IFS= read -r repo_doc; do
            if ! printf '%s\n' "$pack_files" | grep -Fxq "$repo_doc"; then
              missing="$missing $repo_doc"
            fi
          done < <(find docs -maxdepth 1 -type f -name '*.md' | sort)
          if [ -n "$missing" ]; then
            echo "ERROR: top-level docs/*.md files exist in repo but are missing from npm package:" >&2
            for f in $missing; do echo "  - $f" >&2; done
            echo "Add them to package.json files allow-list or remove them from the repo." >&2
            exit 1
          fi
          echo "OK: all top-level docs/*.md files are included in npm package."
