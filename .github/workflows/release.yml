name: Release and Package Mirror

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.35.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build GitHub release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Verify package version matches tag
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $TAG_NAME"
            exit 1
          fi

      - name: Run release validation
        run: |
          cargo fmt --all --check
          git diff --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --bin qmonster

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p "dist/qmonster-${TAG_NAME}-linux-x86_64"
          cp target/release/qmonster "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          cp README.md LICENSE VERSION.md "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          cp config/qmonster.example.toml "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          tar -C dist -czf "dist/qmonster-${TAG_NAME}-linux-x86_64.tar.gz" "qmonster-${TAG_NAME}-linux-x86_64"
          npm pack --pack-destination dist
          find dist -maxdepth 1 -type f ! -name checksums.txt -print0 | sort -z | xargs -0 sha256sum > dist/checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --generate-notes --verify-tag
          fi

  publish:
    name: Publish npm and GitHub Packages mirrors
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Verify package version matches tag
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $TAG_NAME"
            exit 1
          fi

      - name: Set up npmjs registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish canonical npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping npmjs publish."
            exit 0
          fi
          if npm view "qmonster@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "qmonster@$version already exists on npmjs; skipping."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Set up GitHub Packages npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@chquandogong"

      - name: Rewrite package name for GitHub Packages mirror
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@chquandogong/qmonster';
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Publish GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@chquandogong/qmonster@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@chquandogong/qmonster@$version already exists on GitHub Packages; skipping."
            exit 0
          fi
          npm publish --registry=https://npm.pkg.github.com
