name: Release and Package Mirror

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.35.1"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build GitHub release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup component add rustfmt clippy

      - name: Verify package version matches tag
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $TAG_NAME"
            exit 1
          fi

      - name: Run release validation
        run: |
          cargo fmt --all --check
          git diff --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings -A clippy::uninlined_format_args

      - name: Audit cargo dependencies for known advisories
        # Defense-in-depth: ci.yml also runs this gate at PR time, but a
        # tag whose green CI predates a fresh RustSec advisory could
        # still publish without this. Codex CFX-136R-3 closure.
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        run: cargo build --release --bin qmonster

      - name: Prepare release output directory
        run: mkdir -p dist

      - name: Assemble release artifacts (tar + npm pack)
        run: |
          set -euo pipefail
          mkdir -p "dist/qmonster-${TAG_NAME}-linux-x86_64"
          cp target/release/qmonster "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          cp README.md LICENSE VERSION.md "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          cp config/qmonster.example.toml "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          # Include Cargo.lock so syft's rust-cargo-lock cataloger can
          # extract the full dependency graph for the released binary.
          # Without this the SBOM collapses to 1 package (the directory
          # itself) — see v1.36.2 regression.
          cp Cargo.lock "dist/qmonster-${TAG_NAME}-linux-x86_64/"
          tar -C dist -czf "dist/qmonster-${TAG_NAME}-linux-x86_64.tar.gz" "qmonster-${TAG_NAME}-linux-x86_64"
          npm pack --pack-destination dist

      - name: Generate SBOM (SPDX-JSON, scans the released binary directory)
        uses: anchore/sbom-action@v0
        with:
          path: dist/qmonster-${{ env.TAG_NAME }}-linux-x86_64
          format: spdx-json
          output-file: dist/qmonster-${{ env.TAG_NAME }}-sbom.spdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Validate SBOM has substantive dependency graph
        run: |
          set -euo pipefail
          sbom_path="dist/qmonster-${TAG_NAME}-sbom.spdx.json"
          # Use sbom-diff.js --count so the SPDX root-document filter is
          # applied here too — same source of truth as the diff step.
          pkg_count="$(node scripts/release/sbom-diff.js --count "$sbom_path")"
          # 50 is well below qmonster's actual cargo-deps count (~257 at
          # v1.36.3) and high enough to detect a cataloger collapse like
          # v1.36.2's 1-package regression.
          if [ "$pkg_count" -lt 50 ]; then
            echo "ERROR: SBOM has only $pkg_count packages — too few, suggests dependency cataloger failed. Expected >= 50." >&2
            exit 1
          fi
          echo "OK: SBOM contains $pkg_count packages."

      - name: Compare SBOM with previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sbom="dist/qmonster-${TAG_NAME}-sbom.spdx.json"
          previous_tag="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
              | grep -vx "$TAG_NAME" \
              | head -n 1 || true
          )"

          if [ -z "$previous_tag" ]; then
            cat > dist/sbom-diff-summary.txt <<EOF
          # SBOM Diff Summary

          Current tag: ${TAG_NAME}
          Previous tag: unavailable

          No previous semver release tag was found, so no SBOM comparison was run.
          EOF
            exit 0
          fi

          previous_dir="$(mktemp -d)"
          previous_asset="qmonster-${previous_tag}-sbom.spdx.json"
          if ! gh release download "$previous_tag" --pattern "$previous_asset" --dir "$previous_dir"; then
            cat > dist/sbom-diff-summary.txt <<EOF
          # SBOM Diff Summary

          Current tag: ${TAG_NAME}
          Previous tag: ${previous_tag}

          Previous SBOM asset ${previous_asset} could not be downloaded.
          The release continues because older tags may not have SBOM assets.
          EOF
            exit 0
          fi

          previous_sbom="${previous_dir}/${previous_asset}"
          # Single source of truth for the SPDX root-document filter:
          # scripts/release/sbom-diff.js --count and --count-purl modes.
          # Eliminates the parallel inline filter that previously lived
          # here (Gemini MF-3 / Codex CFX-136R-2 closure).
          current_count="$(node scripts/release/sbom-diff.js --count "$current_sbom")"
          previous_count="$(node scripts/release/sbom-diff.js --count "$previous_sbom")"
          current_purl_count="$(node scripts/release/sbom-diff.js --count-purl "$current_sbom")"
          previous_purl_count="$(node scripts/release/sbom-diff.js --count-purl "$previous_sbom")"
          minimum_allowed=$(( previous_count / 2 ))
          if [ "$minimum_allowed" -lt 50 ]; then
            minimum_allowed=50
          fi
          minimum_purl_allowed=$(( previous_purl_count / 2 ))
          if [ "$minimum_purl_allowed" -lt 50 ]; then
            minimum_purl_allowed=50
          fi

          node scripts/release/sbom-diff.js \
            "$previous_sbom" "$current_sbom" \
            "$previous_tag" "$TAG_NAME" \
            > dist/sbom-diff-summary.txt

          if [ "$current_count" -lt "$minimum_allowed" ]; then
            echo "ERROR: SBOM package count dropped from $previous_count to $current_count; minimum allowed is $minimum_allowed." >&2
            echo "See dist/sbom-diff-summary.txt for details." >&2
            exit 1
          fi
          if [ "$current_purl_count" -lt "$minimum_purl_allowed" ]; then
            echo "ERROR: SBOM purl coverage dropped from $previous_purl_count to $current_purl_count; minimum allowed is $minimum_purl_allowed." >&2
            echo "See dist/sbom-diff-summary.txt for details." >&2
            exit 1
          fi
          echo "OK: SBOM package count $current_count compared with $previous_count in $previous_tag."
          echo "OK: SBOM purl coverage $current_purl_count compared with $previous_purl_count in $previous_tag."

      - name: Compute release checksums
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > checksums.txt
          )

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/qmonster-${{ env.TAG_NAME }}-linux-x86_64.tar.gz
            dist/qmonster-*.tgz
            dist/qmonster-${{ env.TAG_NAME }}-sbom.spdx.json
            dist/sbom-diff-summary.txt
            dist/checksums.txt

      - name: Generate SBOM attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/qmonster-${{ env.TAG_NAME }}-linux-x86_64.tar.gz
          sbom-path: dist/qmonster-${{ env.TAG_NAME }}-sbom.spdx.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/*.tgz dist/*-sbom.spdx.json dist/sbom-diff-summary.txt dist/checksums.txt)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$TAG_NAME" --generate-notes --verify-tag
          fi

          scripts/release/inject-verification-footer.sh "$TAG_NAME"

  publish:
    name: Publish npm and GitHub Packages mirrors
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TAG_NAME }}

      - name: Verify package version matches tag
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $TAG_NAME"
            exit 1
          fi

      - name: Set up npmjs registry
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish canonical npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping npmjs publish."
            exit 0
          fi
          if npm view "qmonster@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "qmonster@$version already exists on npmjs; skipping."
            exit 0
          fi
          npm publish --access public --provenance

      - name: Set up GitHub Packages npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@chquandogong"

      - name: Rewrite package name for GitHub Packages mirror
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@chquandogong/qmonster';
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Publish GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "@chquandogong/qmonster@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@chquandogong/qmonster@$version already exists on GitHub Packages; skipping."
            exit 0
          fi
          npm publish --registry=https://npm.pkg.github.com
