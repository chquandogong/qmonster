[package]
name = "qmonster"
version = "2.5.0"
edition = "2024"
rust-version = "1.88"
default-run = "qmonster"
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
anyhow = "1"
arboard = { version = "3", default-features = false }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
directories = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
